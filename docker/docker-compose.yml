# Isolated PRISM adversarial lab — no ports published to the Windows/Linux host.
# Containers can only talk to each other on prism-lab (internal: true).

name: prism

services:
  target-server:
    build:
      context: ./target
    container_name: target-server
    hostname: target-server
    networks:
      - prism-lab
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  attacker-bot:
    build:
      context: ./attacker
    container_name: attacker-bot
    hostname: attacker-bot
    networks:
      - prism-lab
    volumes:
      - ..:/app:ro
    working_dir: /app
    depends_on:
      target-server:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  benign-client:
    build:
      context: ./benign
    container_name: benign-client
    hostname: benign-client
    networks:
      - prism-lab
    environment:
      TARGET_HOST: target-server
      BENIGN_INTERVAL: "4.0"
    depends_on:
      target-server:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

networks:
  prism-lab:
    driver: bridge
    internal: true
