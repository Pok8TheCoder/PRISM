# NetForecast Default Configuration

pipeline:
  window_size_sec: 10
  feature_types: ["flow", "packet"]
  dataset: "CIC-IDS-2018"

model:
  architecture: "transformer"  # transformer | lstm | gnn
  d_model: 128
  nhead: 8
  num_layers: 4
  dropout: 0.1
  seq_len: 20

prediction:
  rollout_steps_k: 5
  mitre_stages:
    - Reconnaissance
    - Initial Access
    - Lateral Movement
    - Command & Control
    - Exfiltration

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 50
  seed: 42
