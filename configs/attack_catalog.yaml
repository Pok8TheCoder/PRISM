network_families:
  - family_id: http_c2_obfuscation
    primary_class_id: T1071_http_beacon
    mitre_ids: [T1001, T1132, T1027]
    reason: Indistinguishable HTTP periodic beacon traffic in NetFlow

  - family_id: web_impact_flood
    primary_class_id: T1499_http_flood
    mitre_ids: [T1491, T1485, T1486]
    reason: High-volume HTTP/TCP flood patterns overlap in flow features

  - family_id: network_recon_scan
    primary_class_id: T1046_service_scan
    mitre_ids: [T1590, T1592, T1593, T1594, T1596, T1597, T1598]
    reason: Pre-attack recon manifests as port/service probing

  - family_id: remote_discovery_scan
    primary_class_id: T1018_remote_discovery
    mitre_ids: [T1016, T1010, T1087, T1083, T1082, T1033, T1007]
    reason: Host discovery probes share ICMP/TCP sweep signatures

  - family_id: credential_access_network
    primary_class_id: T1110_ssh_bruteforce
    mitre_ids: [T1111, T1558, T1552]
    reason: Repeated auth attempts on network services

  - family_id: c2_standard_protocol
    primary_class_id: T1071_http_beacon
    mitre_ids: [T1008, T1092, T1665]
    reason: Fallback/alternate C2 channels appear as periodic outbound sessions

  - family_id: exfil_transfer
    primary_class_id: T1041_exfil_c2
    mitre_ids: [T1025, T1029, T1530, T1567]
    reason: Bulk outbound transfer over established sessions

  - family_id: lateral_movement_remote
    primary_class_id: T1021_remote_services
    mitre_ids: [T1025, T1080, T1219]
    reason: Remote admin/session traffic over SSH/RDP/SMB ports

# Legacy aliases used by earlier PoC scripts and PCAP filenames
legacy_strategy_map:
  ssh_bruteforce: T1110_ssh_bruteforce
  port_scan_sequential: T1046_service_scan
  port_scan_random: T1046_service_scan
  http_flood: T1499_http_flood
  slow_loris: T1499_slowloris
  syn_scan_stealth: T1046_service_scan
