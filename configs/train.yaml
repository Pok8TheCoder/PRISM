train:
  batch_size: 1024
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 60
  patience: 60
  grad_clip: 1.0
  lambda_dynamics: 0.3      # Fix A: was 1.0 — dynamics converges fast, reduce dominance
  lambda_infiltration: 3.0
  lambda_mitre: 15.0        # Fix A: was 5.0 — force MITRE head to learn
  lambda_contrastive: 2.0   # Fix B: was 1.0 — better inter-stage separation
  asymmetric_fn_weight: 4.0
  use_focal: true
  use_stop_gradient: true
  max_sq_err: 5.0
  label_smoothing: 0.01
  balanced_sampling: true
  scheduler: "cosine"
  warmup_steps: 300
  device: "cuda"
  seed: 42
  checkpoint_dir: "weights"
  log_dir: "results/logs"
  save_every: 10
