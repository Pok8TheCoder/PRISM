train:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 50
  patience: 10
  grad_clip: 1.0
  lambda_dynamics: 1.0
  lambda_infiltration: 0.5
  lambda_mitre: 0.3
  scheduler: "cosine"
  warmup_steps: 500
  device: "auto"
  seed: 42
  checkpoint_dir: "weights"
  log_dir: "results/logs"
  save_every: 5
