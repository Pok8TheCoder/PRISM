train:
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  epochs: 200
  patience: 200
  grad_clip: 1.0
  lambda_dynamics: 0.5
  lambda_infiltration: 1.2
  lambda_mitre: 1.0
  scheduler: "cosine"
  warmup_steps: 500
  device: "auto"
  seed: 42
  checkpoint_dir: "weights"
  log_dir: "results/logs"
  save_every: 25
